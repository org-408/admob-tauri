[package]
name = "admob-tester"
version = "0.1.0"
description = "Calls admob-tauri on iOS and Android with Google's test ad units"
edition = "2021"
publish = false

[lib]
name = "admob_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
admob-tauri = { path = "../../../crates/admob-tauri" }

# A small debug build: the emulator's storage is small and the debug symbols are most of the app
[profile.dev]
debug = false
strip = true
