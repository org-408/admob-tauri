<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>admob-tester</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 12px) 12px 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      #summary {
        font-weight: 600;
        margin-bottom: 8px;
      }
      #buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      button {
        font-size: 14px;
        padding: 8px 10px;
      }
      #events,
      #log {
        font:
          12px ui-monospace,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .ok {
        color: #1a7f37;
      }
      .fail {
        color: #cf222e;
      }
    </style>
  </head>
  <body>
    <h1>admob-tester</h1>
    <div id="summary">not run</div>
    <div id="buttons"></div>
    <div id="events"></div>
    <div id="log"></div>
    <script>
      // Shows an error that stops the page (a webview has no console on a phone)
      const show = (message) => (document.getElementById('log').textContent += `error: ${message}\n`);
      window.addEventListener('error', (e) => show(e.message));
      window.addEventListener('unhandledrejection', (e) =>
        show(String(e.reason && e.reason.message ? e.reason.message : e.reason)),
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
