name: CI

# Pull requests: Linux only (cheap). develop and by hand: also iOS on a Mac.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The autogenerated permissions are up to date
        run: git diff --exit-code -- crates/*/permissions

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: dist-js/ is up to date
        run: git diff --exit-code -- crates/*/dist-js

  android:
    # The Kotlin and Java plugin compile and its unit tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Tauri's Android library (the plugin's build script copies it next to the plugin)
        run: cargo check --workspace --target aarch64-linux-android
      - run: gradle -p crates/admob-tauri/android testDebugUnitTest

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      # What an app sets with bundle.iOS.minimumSystemVersion (README: 15.0 or later, as upstream needs)
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Use Xcode 27 or later
        # The Google SDKs are binary frameworks. swift-rs builds the Swift package for an iOS target with `--triple` only
        # on Xcode 27; Xcode 26 builds it for the macOS host and fails with "no such module 'GoogleMobileAds'"
        # (docs/TECH-NOTES.md). Without Xcode 27 on the runner the check is skipped with a warning.
        id: xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[7-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::warning::No Xcode 27 on this runner: the iOS build check is skipped"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The Swift plugin compiles with the Google Mobile Ads SDK (and Tauri's Swift package is in place)
        if: steps.xcode.outputs.found == 'true'
        run: cargo check --workspace --target aarch64-apple-ios-sim
